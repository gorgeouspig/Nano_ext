[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nano_ext"
version = "0.1.0"
description = "Brand New Nanopore Signal Extraction — Event detection from nanopore current traces"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Eiji KATO"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyabf>=2.3",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
notebook = [
    "ipywidgets>=8.0",
    "plotly>=5.0",
    "ipykernel>=6.0",
    "ipyfilechooser>=0.6",
    "nbformat>=4.2.0",
]

[project.scripts]
nano-ext = "nano_ext.cli:main"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "nano_ext._nano_ext"
bindings = "pyo3"
strip = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["nano_ext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: tests involving GMM fitting or large Rust baseline calls (run with -m slow)",
]