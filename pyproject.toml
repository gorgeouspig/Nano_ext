[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nano_ext"
version = "1.2.0"
description = "Nanopore current-trace event detection: objective thresholds, sub-level and HMM analysis, Bayesian statistics, and a browser GUI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Eiji KATO"},
]
keywords = ["nanopore", "electrophysiology", "event detection", "ABF", "single molecule", "HMM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyabf>=2.3",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
notebook = [
    "ipywidgets>=8.0",
    "plotly>=5.0",
    "ipykernel>=6.0",
    "ipyfilechooser>=0.6",
    "nbformat>=4.2.0",
]
hmm = [
    "hmmlearn>=0.3",
]
gui = [
    "dash>=2.16,<5",
    "plotly>=5.0",
    "tsdownsample>=0.1.3",
]
all = [
    "nano_ext[gui,hmm,notebook]",
]

[project.urls]
Homepage = "https://github.com/gorgeouspig/Nano_ext"
Repository = "https://github.com/gorgeouspig/Nano_ext"
Issues = "https://github.com/gorgeouspig/Nano_ext/issues"

[project.scripts]
nano-ext = "nano_ext.cli:main"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "nano_ext._nano_ext"
bindings = "pyo3"
strip = true
include = [{ path = "LICENSE", format = "sdist" }]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nano_ext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: tests involving GMM fitting or large Rust baseline calls (run with -m slow)",
]